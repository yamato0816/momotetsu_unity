name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: node --check src/worker.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tree-sitter tree-sitter-c-sharp
      - run: python ../ci/check_unity_syntax.py

      - run: python ../ci/check_scene.py
